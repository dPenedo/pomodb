[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodb"
version = "0.2.0"
readme = "README.md"
description = "A Pomodoro timer for the terminal that stores every session in a database"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pomodb = "pomodoro.__main__:main"

[tool.setuptools.packages.find]
include = ["pomodoro*"]

[tool.setuptools.package-data]
pomodoro = ["sounds/*.mp3"]
